# 构建镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 拆成两个 job 的原因：
#   1. Dockerfile 第 66 行要 COPY 一个 win-x64 的 AOT 产物（UniApkBuilder.exe），
#      该文件不在 git 里，必须在 CI 里现做；
#   2. Native AOT 不支持跨 OS 编译，Windows 目标只能在 Windows 上发布；
#      而 GitHub 的 Windows 运行器只能跑 Windows 容器，所以镜像构建放在 ubuntu。

name: Build & Push Image

on:
  push:
    tags: ['v*']          # 推 v1.1.0 这类 tag 时出正式版
  workflow_dispatch:      # 也可手动跑（出 :test tag）

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}   # 镜像名：ghcr.io/<所有者>/<仓库名>
  CACHE_REF: ghcr.io/${{ github.repository }}:buildcache  # 专门用来存放构建缓存，后续构建会快很多

jobs:
  # ---------- 出客户端 exe ----------
  client:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4   # clone 代码到工作目录

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet publish (win-x64 AOT)
        run: dotnet publish UniApkBuilder/UniApkBuilder/UniApkBuilder.csproj -p:PublishProfile="Properties\PublishProfiles\FolderProfile.pubxml"

      - uses: actions/upload-artifact@v4
        with:
          name: UniApkBuilder-exe
          path: UniApkBuilder/UniApkBuilder/bin/publish/UniApkBuilder.exe
          if-no-files-found: error

  # ---------- 构建 Linux 镜像并推送 ----------
  image:
    needs: client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 取回 exe 放到 Dockerfile 期望的位置
        uses: actions/download-artifact@v4
        with:
          name: UniApkBuilder-exe
          path: UniApkBuilder/UniApkBuilder/bin/publish

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max

      - name: 输出摘要
        run: |
          echo "### 已推送 ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
